<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>StoryRoute 스토리루트</title>
<style>
:root{--bg:#f7f3ec;--card:#fff;--ink:#222a30;--mute:#6d7780;--acc:#c8553d;--acc2:#fbeae5;--line:#e7e1d5;--g1:#f4c7a1;--g2:#e98f7a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--card:#1f2428;--ink:#f0f2f3;--mute:#9ea9b0;--acc:#f08a72;--acc2:#33211d;--line:#2d343a;--g1:#6b4a3a;--g2:#7a3f33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--card:#1f2428;--ink:#f0f2f3;--mute:#9ea9b0;--acc:#f08a72;--acc2:#33211d;--line:#2d343a;--g1:#6b4a3a;--g2:#7a3f33;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.6}
main{max-width:560px;margin:0 auto;padding:20px 16px 48px}
.logo{font-weight:800;letter-spacing:-.5px;font-size:1.5rem;margin:6px 0 2px}.logo span{color:var(--acc)}
.sub{color:var(--mute);margin:0 0 18px;font-size:.95rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
h3{font-size:.9rem;margin:0 0 8px;color:var(--mute);font-weight:600}
.sec{margin-top:16px}.sec:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.9rem;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer;width:auto;margin:0;font-weight:500}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on,:root:not([data-theme="light"]) .go{color:#1b0f0c}}
input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.go{font:inherit;font-weight:700;width:100%;margin-top:6px;padding:14px;border:0;border-radius:14px;background:var(--acc);color:#fff;cursor:pointer}
.go:disabled{opacity:.6}
.ghost{background:transparent;color:var(--acc);border:1px solid var(--acc);margin-top:8px}
.msg{text-align:center;color:var(--mute);padding:14px}.err{color:#c0392b}
.cover{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;border:0;padding:24px 20px}
.cover h2{margin:0 0 6px;font-size:1.35rem;line-height:1.3}.cover p{margin:0;opacity:.95;font-size:.95rem}
.flow{position:relative;padding-left:22px}
.flow:before{content:"";position:absolute;left:7px;top:6px;bottom:6px;border-left:2px dashed var(--line)}
.dot{position:absolute;left:-22px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--acc);border:3px solid var(--bg)}
.item{position:relative}
.place{padding:0;overflow:hidden}
.ph{padding:14px 16px;background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.ph .t{font-size:.8rem;opacity:.9;font-weight:600}.ph .n{font-size:1.15rem;font-weight:800;margin-top:2px}.ph .l{font-size:.85rem;opacity:.95}
.pb{padding:14px 16px}
.blk{margin-bottom:12px}.blk:last-child{margin-bottom:0}
.blk b{display:block;font-size:.78rem;color:var(--acc);margin-bottom:2px;letter-spacing:.3px}
.blk div{font-size:.93rem}
.transit{background:var(--acc2);border-style:dashed}
.transit .m{font-weight:700;font-size:.92rem}.transit .s{font-size:.9rem;color:var(--mute);margin-top:4px}
</style>
</head>
<body>
<main>
<div class="logo">Story<span>Route</span></div>
<p class="sub">이동의 모든 순간이 이야기가 되는 맞춤형 1일 리플렛</p>

<section id="form">
  <div class="card">
    <div class="sec"><h3>여행 지역</h3>
      <div class="chips" data-k="region" data-one="1"><button class="chip on" data-v="국내">🇰🇷 국내</button><button class="chip" data-v="해외">🌏 해외</button></div>
      <input id="city" placeholder="도시 입력 (예: 서울, 제주, 경주 / 도쿄, 파리, 다낭)"></div>
    <div class="sec"><h3>가용 시간</h3>
      <div class="chips" data-k="time" data-one="1"><button class="chip" data-v="반일 5시간">반일 5시간</button><button class="chip on" data-v="전일 10시간">전일 10시간</button></div></div>
    <div class="sec"><h3>동행</h3>
      <div class="chips" data-k="who" data-one="1"><button class="chip on" data-v="혼자">혼자</button><button class="chip" data-v="연인">연인</button><button class="chip" data-v="친구">친구</button><button class="chip" data-v="가족">가족</button></div></div>
    <div class="sec"><h3>이동 수단</h3>
      <div class="chips" data-k="move" data-one="1"><button class="chip on" data-v="도보+대중교통">도보+대중교통</button><button class="chip" data-v="자차/렌터카">자차/렌터카</button><button class="chip" data-v="택시">택시</button></div></div>
    <div class="sec"><h3>취향 테마 (여러 개 선택)</h3>
      <div class="chips" data-k="theme"><button class="chip" data-v="감성 카페 & 디저트">☕ 감성 카페 & 디저트</button><button class="chip" data-v="자연/힐링/야경 산책">🌿 자연/힐링/야경 산책</button><button class="chip" data-v="역사/문화재/도슨트">🏯 역사/문화재/도슨트</button><button class="chip" data-v="핫플/인생샷 사진 스팟">📸 핫플/인생샷</button><button class="chip" data-v="로컬 마켓/쇼핑/골목 탐방">🛍️ 로컬 마켓/골목 탐방</button></div></div>
    <div class="sec"><h3>톤앤매너</h3>
      <div class="chips" data-k="tone" data-one="1"><button class="chip on" data-v="여유로운 힐링">🍃 여유로운 힐링</button><button class="chip" data-v="알찬 핫플 탐방">🔥 알찬 핫플 탐방</button><button class="chip" data-v="낭만적인 밤 감성">🌙 낭만적인 밤 감성</button></div></div>
  </div>
  <button class="go" id="go">나만의 리플렛 만들기</button>
</section>

<section id="res" hidden></section>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
  document.querySelectorAll(".chips").forEach(function(g){
    g.addEventListener("click",function(ev){
      var b=ev.target.closest(".chip");if(!b)return;
      if(g.dataset.one){g.querySelectorAll(".chip").forEach(function(c){c.classList.remove("on")});b.classList.add("on")}
      else b.classList.toggle("on");
    });
  });
  function val(k){var g=document.querySelector('[data-k="'+k+'"]');return Array.prototype.map.call(g.querySelectorAll(".chip.on"),function(c){return c.dataset.v})}

  function blk(label,text){var d=el("div","blk");d.appendChild(el("b",null,label));d.appendChild(el("div",null,text));return d}

  function render(d,meta){
    var r=$("res");r.textContent="";
    var cv=el("div","card cover");cv.appendChild(el("h2",null,d.title||(meta.city+" 하루 이야기")));
    cv.appendChild(el("p",null,d.intro||(meta.city+" · "+meta.time+" · "+meta.who+" · "+meta.tone)));r.appendChild(cv);
    var flow=el("div","flow"),n=0;
    (d.cards||[]).forEach(function(c){
      var it=el("div","item");it.appendChild(el("div","dot"));
      if(c.type==="transit"){
        var t=el("div","card transit");
        t.appendChild(el("div","m","🚶 "+(c.method||"이동")+(c.duration?" · "+c.duration:"")));
        t.appendChild(el("div","s",c.story||""));it.appendChild(t);
      }else{
        n++;var p=el("div","card place"),h=el("div","ph");
        h.appendChild(el("div","t","STOP "+n+(c.time?" · "+c.time:"")));
        h.appendChild(el("div","n",c.name||""));if(c.local)h.appendChild(el("div","l",c.local));
        var b=el("div","pb");
        if(c.story)b.appendChild(blk("📖 스토리 & 비하인드",c.story));
        if(c.tip)b.appendChild(blk("💡 핵심 이용 팁",c.tip));
        if(c.photo)b.appendChild(blk("📸 Photo Guide",c.photo));
        p.appendChild(h);p.appendChild(b);it.appendChild(p);
      }
      flow.appendChild(it);
    });
    r.appendChild(flow);
    var back=el("button","go ghost","다시 만들기");
    back.addEventListener("click",function(){r.hidden=true;$("form").hidden=false;window.scrollTo(0,0)});
    r.appendChild(back);
    $("form").hidden=true;r.hidden=false;window.scrollTo(0,0);
  }

  $("go").addEventListener("click",async function(){
    var city=$("city").value.trim(),btn=$("go");
    if(!city){$("city").focus();$("city").placeholder="도시를 먼저 입력해 주세요";return}
    var meta={region:val("region")[0],city:city,time:val("time")[0],who:val("who")[0],move:val("move")[0],tone:val("tone")[0],themes:val("theme")};
    btn.disabled=true;btn.textContent="이야기를 엮는 중…";
    try{
      var res=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(meta)});
      var data=await res.json();
      if(!res.ok)throw new Error(data.error||"error");
      render(data,meta);
    }catch(err){
      alert("리플렛을 만들지 못했어요. 잠시 후 다시 시도해 주세요.");
    }
    btn.disabled=false;btn.textContent="나만의 리플렛 만들기";
  });
})();
</script>
</body>
</html>
